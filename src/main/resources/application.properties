spring.application.name=HeatSafeClimaAPI
server.port=${PORT:8080}

# --- Banco de dados (MySQL) ---
# Os valores padrão batem com o docker-compose.yml do projeto (docker compose up -d).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/heatsafe?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:heatsafe}

# O esquema é criado e versionado só pelo Flyway (db/migration); o Hibernate não altera tabelas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Carga inicial dos dados reais do INMET ---
# Na primeira execução, importa as observações diárias da estação A701 (2015-2025) se a tabela estiver vazia.
app.dados.carregar-inmet=${CARREGAR_INMET:true}
app.dados.arquivo-inmet=classpath:dados/inmet_a701_diario_2015_2025.csv
app.dados.estacao-inmet=A701

# --- Previsão ---
# Probabilidade a partir da qual o dia seguinte é considerado perigoso.
# 0.2 teve o melhor F1 na validação (2019-2022); no teste (2023-2025): recall 0.60, precisão 0.54. Ver README.
app.previsao.limiar-probabilidade=${LIMIAR_PREVISAO:0.2}

# --- CORS: origens permitidas separadas por vírgula (app mobile web, API C#) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:5000,http://localhost:3000}

# --- Upload do CSV de importação ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
