# Perfil "test": banco H2 em memória no modo MySQL (não exige MySQL instalado).
# As migrações do Flyway rodam também nos testes, então o esquema testado é o mesmo da produção.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
app.dados.carregar-inmet=false
