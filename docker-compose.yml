# Banco MySQL para desenvolvimento local.
# Subir: docker compose up -d   |   Parar: docker compose down
services:
  mysql:
    image: mysql:8.4
    container_name: heatsafe-mysql
    environment:
      MYSQL_DATABASE: heatsafe
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-heatsafe}
    ports:
      - "3306:3306"
    volumes:
      - heatsafe-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-heatsafe}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  heatsafe-mysql-data:
